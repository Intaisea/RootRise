<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset RootRise password</title><link rel="stylesheet" href="admin/admin.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:18px}.reset-card{width:min(430px,100%);background:#fffefa;border:1px solid #e1e5db;border-radius:24px;padding:30px;box-shadow:0 18px 50px #1d33210d}.reset-card h1{font:700 27px Manrope,sans-serif;letter-spacing:-.05em}.reset-card label{display:block;font-size:11px;font-weight:700;margin:13px 0 6px}.reset-card input{width:100%;border:1px solid #e1e5db;border-radius:11px;padding:12px}.reset-card .primary{width:100%;margin-top:18px}.reset-note{font-size:11px;color:#768176;line-height:1.6}.reset-message{min-height:24px;font-size:11px;color:#476f4c;margin-top:10px}</style></head><body><main class="reset-card"><a class="brand" href="index.html"><div class="brand-mark">R<span>↗</span></div><div><b>RootRise</b><small>PASSWORD RECOVERY</small></div></a><h1>Choose a new password</h1><p class="reset-note">Your one-time reset link expires after 30 minutes. RootRise support cannot see your new or previous password.</p><form id="resetForm"><label for="newPassword">New password</label><input id="newPassword" type="password" minlength="12" required autocomplete="new-password"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" minlength="12" required autocomplete="new-password"><button class="primary" type="submit">Update password <span>↗</span></button></form><div id="resetMessage" class="reset-message" role="status"></div><a class="back" href="index.html">← Return to RootRise</a></main><script src="js/api-config.js"></script><script type="module" src="js/reset.js"></script></body></html>
